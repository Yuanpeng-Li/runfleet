name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]   # the floor and the dev interpreter (.python-version)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src/runfleet
      - run: uv run pytest -q   # `-m real` tests are never run in CI
      - run: uv run python scripts/gen_docs.py --check   # docs/USER_GUIDE.md key table matches ui/keymap.py

  package:
    # §11.1 WP4 acceptance: the built package installs into a clean tool environment and runs the demo stack.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv build
      - name: uvx from the wheel
        run: |
          wheel=$(ls dist/runfleet-*.whl)
          uvx --from "$wheel" runfleet --version
          uvx --from "$wheel" runfleet hosts list --demo
          # one full poll of the simulated fleet through the real collectors (lynx starts NEEDS_AUTH, so leave it out)
          uvx --from "$wheel" runfleet snapshot --demo --json k2 vega lyra labstation > snapshot.json
          python3 -c "import json; d = json.load(open('snapshot.json')); assert d['schema'] == 'runfleet.snapshot/1'; assert len(d['hosts']) == 4"
      - name: uvx from the source tree
        run: uvx --from . runfleet --version
      - name: smoke script syntax (never executed in CI)
        run: bash -n scripts/smoke_real.sh
