name: Pages

# The project page (site/) at https://yuanpeng-li.github.io/runfleet/. Plain static files, no build: the demo data
# (site/runfleet-demo.json) is recorded locally with scripts/web_demo.py, with --deny and --world-hook, and committed.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset URLs with the commit, so browsers fetch the new files after a deploy
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
